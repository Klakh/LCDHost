name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the
        [existing issues](https://github.com/LokLakh-s/LCDHost-Revival/issues) first.
        Security problems must be reported privately, see SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load plugin ...
        2. Open layout ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LCDHost version
      description: Shown in Help → About. Mention where the build comes from (CI artifact, own build, commit).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2, Ubuntu 24.04, ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Output device
      placeholder: G19, G15 v2, virtual 320x240, ...
  - type: dropdown
    id: logitech
    attributes:
      label: Logitech software installed (Windows)
      options:
        - None
        - Logitech Gaming Software (LGS)
        - G HUB
        - Not applicable
  - type: textarea
    id: plugins
    attributes:
      label: Plugins and layout involved
      description: Which plugins are loaded, and which layout (attach it if possible).
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Relevant part of the log from Documents/LCDHost/logs/.
        Remove any personal information before posting.
      render: text
